<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f7f9" />
    <meta
      name="description"
      content="CreditCompass — understand your credit utilization, track your score and manage income, expenses, savings, loans and cards in one place."
    />
    <title>CreditCompass — Credit health & personal finance</title>
    <script>
      // Apply the stored theme before first paint so there is no flash of the wrong mode.
      ;(function () {
        try {
          // The second key is the pre-rename one, so an existing install keeps its theme.
          var stored =
            localStorage.getItem('creditcompass.theme') || localStorage.getItem('moneyflow.theme') || 'system'
          var resolved =
            stored === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : stored
          document.documentElement.setAttribute('data-theme', resolved)
          document.documentElement.style.colorScheme = resolved
        } catch (e) {
          /* localStorage unavailable — fall back to the light default in the markup */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
