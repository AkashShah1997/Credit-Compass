# Runs on every push to main and on every pull request.
#
# `npm run build` is `tsc -b && vite build`, so this one step covers both the
# typecheck and the production bundle — which is the thing that actually has to
# work, since a build that only passes locally is how a blank page reached
# production once already.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A second push to the same branch makes the first run irrelevant; cancel it
# rather than paying for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # `ci` not `install`: installs exactly what package-lock.json pins and
      # fails if the two have drifted, which is what you want on a build server.
      - run: npm ci

      - run: npm run lint

      - run: npm run build

      # Everything below publishes the build for release use, and only on a
      # push to main. Pull requests still run lint and build above — they just
      # do not produce an artifact, since nothing has been merged yet.
      - name: Read version from package.json
        id: pkg
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Upload production build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: credit-compass-v${{ steps.pkg.outputs.version }}-dist
          # `path: dist` uploads the folder's *contents*, so the zip opens
          # straight onto index.html rather than a nested dist/ directory.
          path: dist
          # A silently empty artifact is worse than a failed build: it looks
          # like a successful release right up until someone downloads it.
          if-no-files-found: error
          retention-days: 30
